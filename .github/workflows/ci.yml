name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the automatic GITHUB_TOKEN; no job here needs more.
permissions:
  contents: read

# Actions are pinned to commit SHAs (tag in the trailing comment) so a moved
# tag can't swap in different code next to our SSH key and Docker Hub token.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never run two deploys against the server at once; queue instead of cancelling.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Set the EC2_HOST_FINGERPRINT secret (SHA256 fingerprint of the server's
      # SSH host key) to make both steps verify the host. Empty = not verified.
      - name: Copy compose and monitoring files to EC2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          source: "docker-compose.prod.yml,monitoring"
          target: "/home/${{ secrets.EC2_USER }}/todo-api"

      - name: SSH into EC2 and deploy this commit
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          envs: DOCKERHUB_USERNAME,POSTGRES_PASSWORD,API_KEY,IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/${{ secrets.EC2_USER }}/todo-api

            docker network inspect todo-net >/dev/null 2>&1 || docker network create todo-net

            # Remember what is running now so a failed deploy can be rolled back.
            PREV_TAG=$(grep -s '^IMAGE_TAG=' .env | cut -d= -f2 || true)

            write_env() {
              umask 077
              printf 'DOCKERHUB_USERNAME=%s\nPOSTGRES_PASSWORD=%s\nAPI_KEY=%s\nIMAGE_TAG=%s\n' \
                "$DOCKERHUB_USERNAME" "$POSTGRES_PASSWORD" "$API_KEY" "$1" > .env
            }

            write_env "$IMAGE_TAG"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            healthy=0
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:3000/health >/dev/null; then healthy=1; break; fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "Health check failed for $IMAGE_TAG" >&2
              docker compose -f docker-compose.prod.yml logs --tail 50 api >&2 || true
              if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$IMAGE_TAG" ]; then
                echo "Rolling back to $PREV_TAG" >&2
                write_env "$PREV_TAG"
                docker compose -f docker-compose.prod.yml up -d
              fi
              exit 1
            fi

            # Monitoring is only managed here once monitoring/.env exists on the server.
            if [ -f monitoring/.env ]; then
              (cd monitoring \
                && docker compose -f docker-compose.monitoring.yml up -d \
                && docker compose -f docker-compose.monitoring.yml up -d --force-recreate prometheus)
            fi

            # Drop images unused for 3+ days so the small root disk doesn't fill up.
            docker image prune -af --filter "until=72h"
