# Values come from a .env file next to this one on the server (written by the
# CI deploy job): DOCKERHUB_USERNAME, IMAGE_TAG, POSTGRES_PASSWORD, API_KEY.
# Use an alphanumeric POSTGRES_PASSWORD; it is embedded in a URL below.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${DOCKERHUB_USERNAME}/todo-api:${IMAGE_TAG:-latest}
    container_name: todo-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://todo_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/todo_db
      API_KEY: ${API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - default
      - todo-net

  db:
    image: postgres:16-alpine
    container_name: todo-db
    environment:
      POSTGRES_USER: todo_user
      # Only read when the data volume is first initialised. To change the
      # password on an existing database, also run ALTER USER inside Postgres.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: todo_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - default

volumes:
  # Keep the project name (directory name "todo-api") stable, and never run
  # `docker compose down -v`: either one leaves the data behind / deletes it.
  pgdata:

networks:
  todo-net:
    external: true
